<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Manage your CES meeting | GigaDevice Americas</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="GigaDevice">
        <span class="brand-sub">Americas</span>
      </a>
      <a class="header-link" href="/">Book a meeting</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card confirm" id="view">
      <p id="loading">Loading your booking</p>
      <div id="details" class="hidden">
        <h2 id="title">Your meeting</h2>
        <p>Confirmation number <span class="ref" id="ref"></span></p>
        <table class="summary"><tbody id="summary"></tbody></table>
        <div class="actions" id="actions">
          <a class="btn btn-primary" id="ics" href="#">Add to calendar</a>
          <button class="btn btn-danger" id="cancelBtn" type="button">Cancel meeting</button>
        </div>
        <p class="small">Need a different time? Cancel this meeting, then book a new one.</p>
      </div>
      <p class="form-error" id="error" role="alert"></p>
    </section>
  </main>

  <script src="/manage.js"></script>
</body>
</html>
